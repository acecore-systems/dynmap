name: Acecore build verification
on:
  push:
    branches: [v3.0, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        platform: [core, spigot, spigot26, forge112]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'forge112' || matrix.platform == 'core'
        with:
          distribution: temurin
          java-version: '8'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform != 'forge112'
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: matrix.platform == 'spigot26'
        with:
          distribution: temurin
          java-version: '25'
      - name: Build and inspect Minecraft 26 candidate
        if: matrix.platform == 'spigot26'
        run: bash gradlew-minecraft26 verifySpigotJar --no-daemon --console=plain
      - name: Test shared core
        if: matrix.platform == 'core'
        run: bash gradlew -PdynmapPlatform=core -PjettyTestJavaHome="$JAVA_HOME_8_X64" :DynmapCore:test --no-daemon --console=plain
      - name: Build and inspect Spigot jar
        if: matrix.platform == 'spigot'
        run: bash gradlew -PdynmapPlatform=spigot verifySpigotJar --no-daemon --console=plain
      - name: Test patched package and build legacy Forge on Java 8
        if: matrix.platform == 'forge112'
        run: java -cp oldgradle/wrapper/gradle-wrapper.jar org.gradle.wrapper.GradleWrapperMain -p oldbuilds :jetty-http-patched:verifyPatchedJettyHttp :forge-1.12.2:build --no-daemon --console=plain
      - name: Preserve verification reports (no plugin binaries)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification-${{ matrix.platform }}-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            DynmapCore/build/reports/tests/
            DynmapCore/build/test-results/
            bukkit-helper-26-2/build/reports/tests/
            bukkit-helper-26-2/build/test-results/
            spigot/build/reports/tests/
            spigot/build/test-results/
            build/reports/acecore/
            dependency-patches/jetty-http/build/reports/tests/
            dependency-patches/jetty-http/build/test-results/
            dependency-patches/jetty-security/build/reports/tests/
            dependency-patches/jetty-security/build/test-results/
            dependency-patches/jetty-server/build/reports/tests/
            dependency-patches/jetty-server/build/test-results/
