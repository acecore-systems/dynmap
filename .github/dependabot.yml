version: 2
registries:
  forge:
    type: maven-repository
    url: https://maven.minecraftforge.net
  sponge:
    type: maven-repository
    url: https://repo.spongepowered.org/repository/maven-public
  mikeprimm:
    type: maven-repository
    url: https://repo.mikeprimm.com

# Minor/patch updates are grouped; major updates remain separate for review.
# List modules explicitly because settings.gradle uses dynamic include expressions.
# Split updates by platform and Minecraft era to stay within the hosted job time limit.
updates:
  - package-ecosystem: gradle
    registries:
      - forge
      - sponge
      - mikeprimm
    directories:
      - "/"
      - "/DynmapCore"
      - "/dependency-patches/jetty-http"
      - "/dependency-patches/jetty-security"
      - "/DynmapCoreAPI"
      - "/dynmap-api"
      - "/spigot"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    ignore:
      # Keep the shared build on Gradle 8 while the legacy Spigot build requires it.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      # Loom 1.14 and higher require Gradle 9. The Forge and legacy Spigot build still uses Gradle 8.
      - dependency-name: "fabric-loom"
        versions: ["[1.14,)"]
      # s3lite references Jakarta JAXB. Version 4 requires Java 11, while Dynmap supports Java 8.
      - dependency-name: "jakarta.xml.bind:jakarta.xml.bind-api"
        versions: ["[4.0.0,)"]
      - dependency-name: "com.sun.xml.bind:jaxb-impl"
        versions: ["[4.0.0,)"]
    groups:
      gradle-shared-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: gradle
