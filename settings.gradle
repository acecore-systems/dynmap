    'forge-1.19.3',
    'forge-1.18.2',
    'forge-1.17.1',
    'forge-1.16.5',
    'forge-1.15.2',
    'forge-1.14.4',
]
modules.findAll { name ->
    platform == 'all' || name in ['DynmapCore', 'DynmapCoreAPI'] ||
        (platform == 'spigot' && (name in ['spigot', 'dynmap-api'] || name.startsWith('bukkit-helper')))
}.each { name -> include ':' + name }
