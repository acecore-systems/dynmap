pluginManagement {
  repositories {
    gradlePluginPortal()
    maven { url "https://maven.fabricmc.net/" }
    maven { url "https://papermc.io/repo/repository/maven-public/" }
  }
}

rootProject.name = 'dynmap-common'

// Focused builds avoid configuring unrelated mod loaders; the default keeps upstream scope.
def platform = providers.gradleProperty('dynmapPlatform').getOrElse('all')
if (!(platform in ['all', 'core', 'spigot'])) {
    throw new GradleException("Unknown dynmapPlatform: ${platform}")
}
def modules = [
    'spigot',
    'bukkit-helper-113-2',
    'bukkit-helper-114-1',
    'bukkit-helper-115',
    'bukkit-helper-116',
    'bukkit-helper-116-2',
    'bukkit-helper-116-3',
    'bukkit-helper-116-4',
    'bukkit-helper-117',
    'bukkit-helper-118',
    'bukkit-helper-118-2',
    'bukkit-helper-119',
    'bukkit-helper-119-3',
    'bukkit-helper-119-4',
    'bukkit-helper-120',
    'bukkit-helper-120-2',
    'bukkit-helper-120-4',
    'bukkit-helper-120-5',
    'bukkit-helper-121',
    'bukkit-helper-121-3',
    'bukkit-helper-121-4',
    'bukkit-helper-121-5',
    'bukkit-helper-121-6',
    'bukkit-helper-121-10',
    'bukkit-helper-121-11',
    'bukkit-helper',
    'dynmap-api',
    'DynmapCore',
    'DynmapCoreAPI',
    'fabric-1.21.6',
    'fabric-1.21.9-10',
    'fabric-1.21.11',
    'fabric-1.20.6',
    'fabric-1.19.4',
    'fabric-1.18.2',
