import java.util.zip.ZipFile

// Both modern Core and Java 8 Forge must shade the verified replacement packages.
def patchedModules = [':jetty-http-patched', ':jetty-security-patched']
shadowJar {
    dependsOn ':jetty-http-patched:verifyPatchedJettyHttp', ':jetty-security-patched:verifyPatchedJettySecurity'
    doFirst {
        def original = project.configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.find {
            it.moduleVersion.id.group == 'org.eclipse.jetty' &&
                it.moduleVersion.id.name in ['jetty-http', 'jetty-security']
        }
        if (original != null) {
            throw new GradleException('An unpatched Jetty artifact remains in the runtime classpath')
        }
        patchedModules.each { path ->
            def patched = project(path).tasks.getByName('jar')
            File archive = patched.hasProperty('archiveFile') ? patched.archiveFile.get().asFile : patched.archivePath
            if (!includedDependencies.files.collect { it.canonicalFile }.contains(archive.canonicalFile)) {
                throw new GradleException("Shadow does not include the patched artifact: ${path}")
            }
        }
    }
    doLast { task ->
        File output = task.hasProperty('archiveFile') ? task.archiveFile.get().asFile : task.archivePath
        Set<String> expected = [] as Set
        Set<String> originalClasses = [] as Set
        patchedModules.each { path ->
            def patchedProject = project(path)
            def patched = patchedProject.tasks.getByName('jar')
            File input = patched.hasProperty('archiveFile') ? patched.archiveFile.get().asFile : patched.archivePath
            new ZipFile(input).withCloseable { zip ->
                zip.entries().findAll { entry ->
                    patchedProject.backportSources.keySet().any { base ->
                        entry.name == base + '.class' || (entry.name.startsWith(base + '$') && entry.name.endsWith('.class'))
                    }
                }.each { entry -> originalClasses.add(entry.name) }
            }
        }
        expected.addAll(originalClasses.collect { it.replace('org/eclipse/jetty/', 'org/dynmap/jetty/') })
        new ZipFile(output).withCloseable { zip ->
            List<String> names = zip.entries().collect { it.name }
            List<String> actual = names.findAll {
                it ==~ /org\/dynmap\/jetty\/(http\/(HttpParser|HttpURI)|security\/ConstraintSecurityHandler)(\$.*)?\.class/
            }
            if (actual.size() != expected.size() || (actual as Set) != expected ||
                names.any { it ==~ /org\/eclipse\/jetty\/(http\/(HttpParser|HttpURI)|security\/ConstraintSecurityHandler)(\$.*)?\.class/ }) {
                throw new GradleException('The final Shadow JAR has missing, duplicate, or unrelocated backported classes')
            }
            expected.each { path ->
                byte[] bytes = zip.getInputStream(zip.getEntry(path)).bytes
                if (((bytes[6] & 255) << 8 | (bytes[7] & 255)) != 52) {
                    throw new GradleException('The final backported classes must remain Java 8 compatible')
                }
            }
            String parser = new String(zip.getInputStream(zip.getEntry('org/dynmap/jetty/http/HttpParser.class')).bytes, 'ISO-8859-1')
            if (!parser.contains('parseChunkSize') || !parser.contains('CHUNK_END')) {
                throw new GradleException('The final parser is missing the backported chunk state machine')
            }
            String uri = new String(zip.getInputStream(zip.getEntry('org/dynmap/jetty/http/HttpURI.class')).bytes, 'ISO-8859-1')
            if (!uri.contains('validateScheme') || !uri.contains('validateInetAddress')) {
                throw new GradleException('The final URI class is missing the backported validation helpers')
            }
            patchedModules.each { path ->
                def p = project(path)
                List<String> documents = ['BACKPORT.md'] + p.backportSources.keySet().collect { it.tokenize('/').last() + '.patch' }
                documents.each { name ->
                    def entry = zip.getEntry(p.backportProvenancePath + '/' + name)
                    if (entry == null || !java.util.Arrays.equals(zip.getInputStream(entry).bytes, p.file(name).bytes)) {
                        throw new GradleException("Backport provenance is missing or differs: ${path}/${name}")
                    }
                }
            }
        }
        logger.lifecycle("Verified ${output.name}: all ${expected.size()} backported classes and package provenance are preserved")
    }
}
